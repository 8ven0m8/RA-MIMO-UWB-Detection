[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rabench"
version = "0.1.0"
description = "Classical ML vs Deep Learning benchmarking for heterogeneous UWB-MIMO antenna S11 sensing (RA detection project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
